<div id="main">
    <div id="dialog">
        <div id="upper">
            <h2 style="margin-top: 3%; color: black;">ADVANCED SEARCH</h2>
        </div>
        <div>
            <form id="movie-form" [formGroup]="movieForm">
            <mat-form-field class="form-field">
                <mat-label>Title</mat-label>
                <input matInput placeholder="Enter movie title" formControlName="title">
              </mat-form-field>
              <mat-form-field class="form-field">
                <mat-label>Description</mat-label>
                <input matInput placeholder="Write a description" formControlName="description">
              </mat-form-field>
              <mat-form-field class="form-field">
                <mat-label>Actors</mat-label>
                <input matInput placeholder="Add actors" formControlName="actors">
              </mat-form-field>
              <mat-form-field class="form-field">
                <mat-label>Director</mat-label>
                <input matInput placeholder="Add director"  formControlName="director">
              </mat-form-field>
              <mat-label style="margin-top: 1%; color: black;"><b>SELECT GENRES</b></mat-label>
              <span style="margin-left: 10%;" formControlName="genres" multiple required id="genres">
                <mat-checkbox *ngFor="let genre of genres" [value]="genre" (change)="onCheckboxChange($event)">{{ genre }}</mat-checkbox>
              </span>
              <button style="margin-top: 3%; background-color: black; color: white;" mat-flat-button>Search</button>
              </form>
        </div>
    </div>
</div>
